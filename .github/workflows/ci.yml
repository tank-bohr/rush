# The public gate for rush. Two independent jobs run concurrently:
#   gate          — the same `bundle exec rake` developers run, plus an explicit
#                   generated-parser drift audit, against the pinned dash oracle.
#   docker-oracle — bin/test-in-docker: full gate plus container-only smokes in
#                   the checksum-pinned image (dash built from source).
# The mutation gate lives in mutant.yml: its ~2 h runtime needs queue
# semantics, and this workflow's cancel-in-progress would kill it on every
# push. The dash pin lives in .github/actions/setup (keep in lockstep with
# docker/rush-test.Dockerfile).
name: CI

# live is deliberately absent from the push triggers: everything on live is
# either an already-gated main commit or the release bot's bump, so CI (and
# the two-hour mutation job in particular) would only re-prove main's state.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Full gate + parser drift
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup

      # `compile` is an mtime-based file task; a fresh checkout would consider
      # the committed parser current. Clobber first so the drift audit compares
      # a genuinely regenerated parser against the committed one.
      - name: Parser drift audit
        run: bundle exec rake clobber_parser check_parser_drift

      - name: Full gate
        run: bundle exec rake

  # ~18 min locally on 16 jobs (36 mutations/s over 38.8k mutations) — expect
  # roughly 2 h on a 4-core runner. Skipped on pull requests: a two-hour lag
  # is no PR feedback; pushes to main and manual dispatch still gate.
  # The threshold is the ratchet floor in the Rakefile (rush-tqq).
  mutant:
    name: Mutation gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup

      - name: Mutation coverage
        run: bundle exec rake mutant:check

  docker-oracle:
    name: Docker oracle (pinned dash image)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache the container bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/docker-bundle
          key: docker-bundle-${{ hashFiles('Gemfile.lock', 'docker/rush-test.Dockerfile') }}
          restore-keys: docker-bundle-

      # RUSH_DOCKER_BUNDLE_VOLUME accepts a host path as well as a named
      # volume; a bind mount lets actions/cache persist the container bundle.
      - name: Run the docker oracle gate
        run: |
          mkdir -p tmp/docker-bundle
          RUSH_DOCKER_BUNDLE_VOLUME="$PWD/tmp/docker-bundle" bin/test-in-docker
