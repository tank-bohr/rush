# Release automation for the `live` branch (rush-qr5.2).
#
# semantic-release derives the next version from Conventional Commits merged
# into `live`, bumps lib/rush/version.rb + Gemfile.lock, writes CHANGELOG.md,
# commits that back to `live` ([skip ci]) and creates the tag + GitHub
# Release. It authenticates with a GitHub App installation token instead of
# GITHUB_TOKEN, because events created with GITHUB_TOKEN never trigger other
# workflows — the Release created here must fire publish.yml.
name: Release

on:
  push:
    branches: [live]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # semantic-release needs the full history and tags to find the previous
      # release. Checking out WITH the app token persists it as the git
      # credential (proper x-access-token basic auth); semantic-release probes
      # the plain remote URL first and keeps it once that push check passes,
      # so the bump commit and tag ride the checkout credential. GH_TOKEN on
      # the release step below only feeds the GitHub API plugin.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: semantic-release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release
