plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Include:
    - '**/*.rb'
    - '**/*.rake'
    - '**/*.gemspec'
    - '**/Rakefile'
    - 'exe/rush'
  Exclude:
    - 'lib/rush/parser.rb'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'pkg/**/*'

# Sandi Metz limits enforced as code style (mirrors the sandi_meter thresholds
# so the gate holds even if the unmaintained gem breaks on Ruby 4.0).
Metrics/MethodLength:
  Max: 5
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  # A constructor that only assigns fields is the least-complex code there is;
  # capping its length just forces a helper-split that hides ivars from reek
  # (InstanceVariableAssumption). Real constructor complexity is still caught by
  # AbcSize, which is NOT exempt here.
  AllowedMethods: ['initialize']

Metrics/ClassLength:
  Max: 100
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']

Metrics/ModuleLength:
  Max: 100
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']

Metrics/ParameterLists:
  Max: 4
  CountKeywordArgs: true

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'
    - 'Rakefile'
    - 'tasks/**/*.rake'

Metrics/AbcSize:
  Max: 15

# The differential corpus is a deliberately large table of shell snippets to
# compare against dash; it grows one block per slice and is data, not logic.
Metrics/CollectionLiteralLength:
  Exclude:
    - 'spec/**/*'

# Per-class/module descriptive comments are the project norm, double-guarded on
# purpose: this cop gives editor/LSP feedback, reek's IrresponsibleModule holds
# the gate. The one concern we deliberately enforce with both tools.
#
# The `X = Data.define(...)` + reopened `class X` nodes are the exception to the
# split: reek sees both the assignment and the reopen as classes and can't be
# satisfied by one comment, so for those classes this cop holds the doc gate (the
# comment lives on the reopen) and reek's IrresponsibleModule exempts them
# (.reek.yml). See docs/journal.md.
Style/Documentation:
  Enabled: true

# RuboCop ships a set of cops disabled by default (opt-in); NewCops:enable does
# NOT turn them on. Every one is listed explicitly here so this file is the single
# source of truth: a RuboCop upgrade can't silently flip a default, and the off
# cops are visible rather than hidden in RuboCop's own defaults.
#
# Opted in — these earn their keep without fighting the project's compact style:
Layout/EmptyLineAfterMultilineCondition:
  Enabled: true
Layout/FirstMethodParameterLineBreak:
  Enabled: true
Layout/HeredocArgumentClosingParenthesis:
  Enabled: true
Layout/MultilineMethodParameterLineBreaks:
  Enabled: true
# Enforce the broad class shape but allow class methods to sit where they read
# best: CLI-style entry points go before initialize, while small factories can
# live next to related instance API.
Layout/ClassStructure:
  Enabled: true
  ExpectedOrder:
    - module_inclusion
    - constants
    - initializer
    - public_methods
    - protected_methods
    - private_methods
Style/UnlessLogicalOperators:
  Enabled: true # forbid the confusing mixed `unless a && b || c`; plain guards stay
Style/InvertibleUnlessCondition:
  Enabled: true # `unless x.zero?` reads better as `if x.nonzero?`
Style/YodaExpression:
  Enabled: true
Style/ArrayCoercion:
  Enabled: true
Style/AutoResourceCleanup:
  Enabled: true
Style/ClassMethodsDefinitions:
  Enabled: true
Style/CollectionMethods:
  Enabled: true
Style/DataInheritance:
  Enabled: true
Style/DateTime:
  Enabled: true
Style/ImplicitRuntimeError:
  Enabled: true # raise must name an error class, not a bare RuntimeError
Style/MethodCalledOnDoEndBlock:
  Enabled: true
Style/MissingElse:
  Enabled: true
Style/MultilineMethodSignature:
  Enabled: true
Style/OptionHash:
  Enabled: true
Style/RedundantStructKeywordInit:
  Enabled: true
Style/ReturnNil:
  Enabled: true # bare `return` everywhere; `return nil` is redundant
Style/StaticClass:
  Enabled: true
Style/StringMethods:
  Enabled: true
Style/TopLevelMethodDefinition:
  Enabled: true
Style/TrailingCommaInBlockArgs:
  Enabled: true
Lint/ShadowingOuterLocalVariable:
  Enabled: true
Lint/HeredocMethodCallPosition:
  Enabled: true
# AST::Node has no initializer state; forcing subclass constructors to call the
# no-op Object#initialize only satisfies the cop and leaves equivalent mutants.
Lint/MissingSuper:
  Exclude:
    - 'lib/rush/ast/*.rb'
# Number conversions where lenient-to-zero IS the contract, each at an OS or
# test-double boundary (regex-guarded parsers were converted to Integer(_, 10)
# and left the list — rush-qle):
Lint/NumberConversion:
  Enabled: true
  Exclude:
    - 'lib/rush/status.rb'                  # nil termsig/stopsig from Process::Status pins to 0
    - 'lib/rush/system_calls/file_tests.rb' # File.size? nil (absent file) counts as empty
    - 'spec/support/fake_system_calls.rb'   # the double mirrors file_tests' nil-to-zero
Performance/ArraySemiInfiniteRangeSlice:
  Enabled: true
Performance/BigDecimalWithNumericArgument:
  Enabled: true
Performance/BlockGivenWithExplicitBlock:
  Enabled: true
Performance/Casecmp:
  Enabled: true
Performance/CaseWhenSplat:
  Enabled: true
Performance/ChainArrayAllocation:
  Enabled: true
Performance/IoReadlines:
  Enabled: true
Performance/OpenStruct:
  Enabled: true
Performance/SelectMap:
  Enabled: true
Naming/InclusiveLanguage:
  Enabled: true

# Left off — each weighed against the project's style and rejected; pinned to
# false so the decision is explicit. Grouped by department, alphabetical.
# Bundler
Bundler/GemComment: { Enabled: false }
Bundler/GemVersion: { Enabled: false }

# Gemspec
Gemspec/DependencyVersion: { Enabled: false }

# Layout
Layout/FirstArrayElementLineBreak: { Enabled: false }
Layout/FirstHashElementLineBreak: { Enabled: false }
Layout/FirstMethodArgumentLineBreak: { Enabled: false }
Layout/MultilineArrayLineBreaks: { Enabled: false }
Layout/MultilineAssignmentLayout: { Enabled: false }
Layout/MultilineHashKeyLineBreaks: { Enabled: false }
Layout/MultilineMethodArgumentLineBreaks: { Enabled: false }
Layout/RedundantLineBreak: { Enabled: false }
Layout/SingleLineBlockChain: { Enabled: false }

# Lint
Lint/ConstantResolution: { Enabled: false }

# RSpec
RSpec/AlignLeftLetBrace: { Enabled: false }
RSpec/AlignRightLetBrace: { Enabled: false }
RSpec/DescribedClassModuleWrapping: { Enabled: false }
RSpec/Dialect: { Enabled: false }
RSpec/MessageExpectation: { Enabled: false }
RSpec/Pending: { Enabled: false }

# Style
Style/ArrayFirstLast: { Enabled: false }
Style/AsciiComments: { Enabled: false }
Style/ConstantVisibility: { Enabled: false }
Style/Copyright: { Enabled: false }
Style/DisableCopsWithinSourceCodeDirective: { Enabled: false }
Style/DocumentationMethod: { Enabled: false }
Style/HashLookupMethod: { Enabled: false }
Style/InlineComment: { Enabled: false }
Style/IpAddresses: { Enabled: false }
Style/MethodCallWithArgsParentheses: { Enabled: false }
Style/RequireOrder: { Enabled: false }
Style/Send: { Enabled: false }
Style/SingleLineBlockParams: { Enabled: false }
Style/StringHashKeys: { Enabled: false }

# The plan keeps development dependencies declared in the gemspec (single source
# of truth), so do not force them into the Gemfile.
Gemspec/DevelopmentDependencies:
  Enabled: false

# Steep/RBS inline annotations (`#: Type`) carry type information, not prose:
# they need no leading space (the `#:` token is significant) and are excluded
# from the line-length budget, like a sig declared elsewhere would be. Used to
# type hash-of-lambda operator tables, whose param types Steep will not infer
# from a frozen literal (see number.rb / parameter_forms.rb and docs/journal.md).
Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true
Layout/LineLength:
  AllowRBSInlineAnnotation: true

# All method definitions use the def...end form; endless defs are disallowed so
# the same kind of method never appears in two shapes.
Style/EndlessMethod:
  EnforcedStyle: disallow

# number.rb's operator table is uniformly explicit lambdas; for the two bare
# unary operators this cop would force `lambda(&:-@)` / `lambda(&:~)`, which Steep
# can't type (it sees lambda's block as 0-arity, Symbol#to_proc as 1-arity). Off
# for that file so the table stays explicit and type-checks — see docs/journal.md.
Style/SymbolProc:
  Exclude:
    - 'lib/rush/expansion/arithmetic/number.rb'

Naming/MethodParameterName:
  AllowedNames: ['io', 'fd', 'n', 'r', 'w', 'm', 's', 'op']

# Inline Sorbet sigs declare a method's block as a named parameter
# (`params(blk: T.proc...)`), so any method with a sig'd block must name it `&blk`
# and forward it explicitly — anonymous block forwarding (`&`) and `...` are
# incompatible with that. Enforce the named form project-wide so the two stay
# consistent (and so there's no per-method disable). See docs/journal.md.
Naming/BlockForwarding:
  EnforcedStyle: explicit
Style/ArgumentsForwarding:
  UseAnonymousForwarding: false

RSpec/ExampleLength:
  Max: 12

RSpec/MultipleExpectations:
  Max: 6

RSpec/NestedGroups:
  Max: 5
