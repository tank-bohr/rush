---
usage: opensource
integration:
  name: rspec
requires:
  - rush
environment_variables:
  RUSH_SKIP_COVERAGE: '1'
matcher:
  subjects:
    - Rush*
  ignore:
    - Rush::Parser*
    # Process-boundary wrappers (the same ones SimpleCov marks :nocov:):
    # their bodies replace or split the process (fork / exit! / real signal
    # dispositions / kill delivery) or need a real terminal (Reline), so no
    # in-process example can observe a mutation. Their behaviour is proven
    # by the differential corpus, subprocess specs and the Docker pty
    # smokes, which all run rush out-of-process (rush-211.8).
    - Rush::SystemCalls#fork
    - Rush::SystemCalls#exit!
    - Rush::SystemCalls#kill
    - Rush::SystemCalls#trap_signal
    - Rush::SystemCalls#edit_line
    # The rush-mv8 job-control syscall cluster is the same boundary: real
    # process groups and a real controlling terminal (ioctl, SIG_IGN around
    # it), proven by the job-control pty smoke in the Docker gate.
    - Rush::SystemCalls#setpgid
    - Rush::SystemCalls#fork_grouped
    - Rush::SystemCalls#grouped_child
    - Rush::SystemCalls#open_tty
    - Rush::SystemCalls#tcgetpgrp
    - Rush::SystemCalls#read_pgrp
    - Rush::SystemCalls#tcsetpgrp
    - Rush::SystemCalls#ignoring_ttou
    - Rush::BackgroundRunner#spawn_child
    - Rush::BackgroundRunner#run_child
    - Rush::SubshellRunner#spawn_child
    - Rush::SubshellRunner#run_child
    - Rush::PipelineRunner#start_stage
mutation:
  timeout: 5.0
