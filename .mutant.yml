---
usage: opensource
integration:
  name: rspec
requires:
  - rush
environment_variables:
  RUSH_SKIP_COVERAGE: '1'
matcher:
  subjects:
    - Rush*
  ignore:
    - Rush::Parser*
    # Process-boundary wrappers (the same ones SimpleCov marks :nocov:):
    # their bodies replace or split the process (fork / exit! / real signal
    # dispositions / kill delivery) or need a real terminal (Reline), so no
    # in-process example can observe a mutation. Their behaviour is proven
    # by the differential corpus, subprocess specs and the Docker pty
    # smokes, which all run rush out-of-process (rush-211.8).
    - Rush::SystemCalls#fork
    - Rush::SystemCalls#exit!
    - Rush::SystemCalls#kill
    - Rush::SystemCalls#trap_signal
    - Rush::SystemCalls#edit_line
    # The rush-mv8 job-control syscall cluster is the same boundary: real
    # process groups and a real controlling terminal (ioctl, SIG_IGN around
    # it), proven by the job-control pty smoke in the Docker gate. Named by
    # the defining module — mutant identifies mixin methods there, not on
    # the including class.
    - Rush::SystemCalls::ProcessControl#setpgid
    - Rush::SystemCalls::ProcessControl#fork_grouped
    - Rush::SystemCalls::ProcessControl#grouped_child
    - Rush::SystemCalls::ProcessControl#open_tty
    - Rush::SystemCalls::ProcessControl#tcgetpgrp
    - Rush::SystemCalls::ProcessControl#read_pgrp
    - Rush::SystemCalls::ProcessControl#tcsetpgrp
    - Rush::SystemCalls::ProcessControl#ignoring_ttou
    - Rush::BackgroundRunner#spawn_child
    - Rush::BackgroundRunner#run_child
    - Rush::SubshellRunner#spawn_child
    - Rush::SubshellRunner#run_child
    - Rush::PipelineRunner#start_stage
    # The Collation fiddle lifecycle: loading libc symbols, malloc/regfree
    # pointer ownership and the T.let annotation around the function table.
    # Mutations here are leaks, double-frees or annotation changes no
    # in-process example can observe; the behaviour-bearing methods of the
    # same class (match?/glob/compare/activate/install/locale_value) stay
    # under mutation with direct unit specs (rush-tqq).
    - Rush::SystemCalls::Collation#initialize
    - Rush::SystemCalls::Collation#load_functions
    - Rush::SystemCalls::Collation#native_function
    - Rush::SystemCalls::Collation#compiled
    - Rush::SystemCalls::Collation#free_after
mutation:
  timeout: 5.0
